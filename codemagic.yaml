workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Plagit Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.invain.mh
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Set code signing to manual
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build iOS
        script: flutter build ipa --release --no-codesign
      - name: Sign and export IPA
        script: |
          xcode-project use-profiles
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # PREREQUISITE: upload the Android upload keystore in Codemagic
      # (Teams -> code signing identities -> Android keystores) and give it the
      # reference name below. Codemagic then exposes CM_KEYSTORE_PATH,
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD during the build.
      android_signing:
        - plagit_upload_keystore
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Write android/key.properties from the Codemagic keystore
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build release AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab